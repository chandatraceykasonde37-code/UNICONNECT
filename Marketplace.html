<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniConnect Zambia | Marketplace</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}


body{

background:#2b2b2b;

color:white;

}



/* HEADER */

header{

display:flex;

justify-content:space-between;

align-items:center;

padding:20px 8%;

background:#171717;

border-bottom:1px solid #444;

position:sticky;

top:0;

z-index:100;

}



.logo{

font-size:30px;

font-weight:800;

}


.logo span{

color:#c084fc;

text-shadow:0 0 20px #a855f7;

}



nav a{

color:white;

text-decoration:none;

margin:0 12px;

}



nav a:hover{

color:#c084fc;

}







/* HERO */


.hero{

padding:70px 8%;

text-align:center;

background:

linear-gradient(

rgba(0,0,0,.6),

rgba(0,0,0,.8)

),

url("images/market.jpg");


background-size:cover;

background-position:center;

}



.hero h1{

font-size:55px;

color:#e9d5ff;

}



.hero p{

font-size:20px;

margin-top:20px;

color:#ddd;

}





/* SEARCH */


.search-box{

margin:40px auto;

width:80%;

}



.search-box input,
.search-box select{


padding:15px;

border-radius:30px;

border:none;

background:#444;

color:white;

margin:5px;


}





/* SELL FORM */


.sell-section{


padding:50px 8%;


}



.box{


background:

rgba(255,255,255,.08);


border:1px solid rgba(255,255,255,.15);


border-radius:25px;


padding:30px;


backdrop-filter:blur(15px);


}





input,
textarea,
select{


width:100%;

padding:15px;

margin:10px 0;

border:none;

border-radius:15px;

background:#333;

color:white;

}



textarea{

height:100px;

}





button{


padding:14px 30px;

border:none;

border-radius:30px;

background:#a855f7;

color:white;

font-weight:bold;

cursor:pointer;

}



button:hover{


transform:translateY(-3px);

}





/* IMAGE PREVIEW */


#preview{

width:180px;

height:150px;

object-fit:cover;

border-radius:20px;

display:none;

margin:15px 0;

}





/* PRODUCTS */


.products{


padding:50px 8%;


display:grid;

grid-template-columns:

repeat(3,1fr);


gap:25px;


}



.product-card{


background:

rgba(255,255,255,.08);


border:1px solid #555;


padding:25px;


border-radius:25px;


}



.product-card img{


width:100%;

height:200px;

object-fit:cover;

border-radius:15px;


}



.product-card h2{


color:#d8b4fe;


}



.price{


color:#c084fc;

font-size:22px;

font-weight:bold;

}






/* ADMIN PANEL */


.admin{


margin:50px 8%;

padding:30px;

background:#171717;

border-radius:25px;

}



.pending-card{


background:#333;

padding:20px;

border-radius:15px;

margin:15px 0;

}





footer{

background:#111;

padding:30px;

text-align:center;

}





@media(max-width:900px){


.products{

grid-template-columns:1fr;

}


nav{

display:none;

}


.hero h1{

font-size:40px;

}


}



</style>

</head>


<body>



<header>


<div class="logo">

UniConnect <span>Zambia</span>

</div>


<nav>

<a href="Home.html">Home</a>

<a href="Boarding.html">Boarding</a>

<a href="Messages.html">Messages</a>

<a href="Profile.html">Profile</a>

</nav>


</header>





<section class="hero">


<h1>

Student Marketplace

</h1>


<p>

Buy and sell safely within the UniConnect Zambia community.

</p>


<div class="search-box">


<input id="search"

placeholder="Search items...">


<select id="categorySearch">

<option value="all">
All Categories
</option>

<option>
Laptops
</option>

<option>
Phones
</option>

<option>
Accessories
</option>

<option>
Books
</option>

<option>
Furniture
</option>


</select>


</div>


</section>





<section class="sell-section">


<div class="box">


<h2>

Sell Your Item

</h2>


<input id="seller"

placeholder="Your name">


<input id="itemName"

placeholder="Item name">



<select id="category">


<option>
Laptops
</option>


<option>
Phones
</option>


<option>
Accessories
</option>


<option>
Books
</option>


<option>
Furniture
</option>


</select>



<input id="price"

placeholder="Price (K)">



<textarea id="description"

placeholder="Description">

</textarea>



<input type="file"

id="image"

accept="image/*">



<img id="preview">



<button>

Submit For Admin Approval

</button>


</div>


</section>
<section>

<h1 style="text-align:center;color:#e9d5ff;">
Available Products
</h1>


<div class="products" id="productList">

</div>


</section>





<section class="admin">

<h2>
👑 Admin Approval Panel
</h2>


<p>
Only approved products will appear publicly.
</p>


<div id="pendingList">

</div>


</section>






<footer>

<h2>
UniConnect Zambia
</h2>

<p>
Connecting Students Across Zambia
</p>

</footer>







<script>


let pendingProducts =
JSON.parse(localStorage.getItem("pendingProducts")) || [];


let approvedProducts =
JSON.parse(localStorage.getItem("approvedProducts")) || [];



let imageData="";





// IMAGE PREVIEW

document
.getElementById("image")
.addEventListener("change",function(e){


let reader=new FileReader();


reader.onload=function(){


imageData=reader.result;


let preview=document
.getElementById("preview");


preview.src=imageData;


preview.style.display="block";


}



reader.readAsDataURL(e.target.files[0]);


});







// SUBMIT PRODUCT


document.querySelector(".sell-section button")
.onclick=function(){



let product={


id:Date.now(),


seller:
document.getElementById("seller").value,


name:
document.getElementById("itemName").value,


category:
document.getElementById("category").value,


price:
document.getElementById("price").value,


description:
document.getElementById("description").value,


image:imageData,


rating:0


};



pendingProducts.push(product);



saveData();


showPending();



alert(

"Your product has been sent to admin approval."

);



};








// SAVE DATA


function saveData(){


localStorage.setItem(

"pendingProducts",

JSON.stringify(pendingProducts)

);


localStorage.setItem(

"approvedProducts",

JSON.stringify(approvedProducts)

);


}







// SHOW ADMIN REQUESTS


function showPending(){


let box=document.getElementById("pendingList");


box.innerHTML="";



pendingProducts.forEach((p,index)=>{


box.innerHTML+=`


<div class="pending-card">


<h3>${p.name}</h3>


<p>
Seller: ${p.seller}
</p>


<p>
Category: ${p.category}
</p>


<p>
Price: K${p.price}
</p>



<button onclick="approve(${index})">

Approve

</button>



<button onclick="reject(${index})">

Reject

</button>



</div>


`;



});


}








// APPROVE


function approve(index){


approvedProducts.push(

pendingProducts[index]

);



pendingProducts.splice(index,1);



saveData();


showPending();


displayProducts();


}







// REJECT


function reject(index){


pendingProducts.splice(index,1);


saveData();


showPending();


}








// DISPLAY PRODUCTS


function displayProducts(){


let box=document.getElementById("productList");


box.innerHTML="";



approvedProducts.forEach((p,index)=>{


box.innerHTML+=`


<div class="product-card">


<img src="${p.image}">



<h2>
${p.name}
</h2>


<p>
${p.category}
</p>



<p class="price">

K${p.price}

</p>


<p>
${p.description}
</p>



<p>
Seller: ${p.seller}
</p>




<p>

⭐ Rating:
${p.rating}

</p>



<button onclick="rate(${index})">

Rate Seller

</button>



<button onclick="contact('${p.seller}')">

Contact Seller

</button>


<button onclick="deleteProduct(${index})">

Delete

</button>



</div>


`;



});


}








// RATING


function rate(index){


approvedProducts[index].rating++;


saveData();


displayProducts();


}







// DELETE


function deleteProduct(index){


approvedProducts.splice(index,1);


saveData();


displayProducts();


}







// CONTACT SELLER


function contact(name){


window.location.href=

"message.html?user="+name;


}








// SEARCH


document
.getElementById("search")
.addEventListener("keyup",filterProducts);



document
.getElementById("categorySearch")
.addEventListener("change",filterProducts);






function filterProducts(){


let text=

document.getElementById("search")
.value
.toLowerCase();



let category=

document.getElementById("categorySearch")
.value;




let box=document.getElementById("productList");


box.innerHTML="";



approvedProducts

.filter(p=>


p.name.toLowerCase()
.includes(text)

&&

(category=="all" ||
p.category==category)



)

.forEach((p)=>{


box.innerHTML+=`


<div class="product-card">


<img src="${p.image}">


<h2>${p.name}</h2>


<p>${p.category}</p>


<p class="price">
K${p.price}
</p>


<p>${p.description}</p>


<p>
Seller: ${p.seller}
</p>


<button onclick="contact('${p.seller}')">

Contact Seller

</button>


</div>


`;


});



}






displayProducts();

showPending();



</script>


</body>

</html>
