<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniConnect Zambia | Profile</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}


body{

background:#2b2b2b;

color:white;

}



/* HEADER */

header{

background:#171717;

padding:20px 8%;

display:flex;

justify-content:space-between;

align-items:center;

}



.logo{

font-size:30px;

font-weight:bold;

}


.logo span{

color:#c084fc;

}




nav a{

color:white;

text-decoration:none;

margin:10px;

}



nav a:hover{

color:#c084fc;

}





/* PROFILE */

.container{

padding:50px 8%;

display:grid;

grid-template-columns:350px 1fr;

gap:30px;

}





.card{

background:

rgba(255,255,255,.08);

border:1px solid #555;

border-radius:25px;

padding:30px;

backdrop-filter:blur(15px);

}




.profile{

text-align:center;

}




.profile img{

width:150px;

height:150px;

border-radius:50%;

object-fit:cover;

border:4px solid #c084fc;

}





.profile h2{

margin-top:20px;

color:#e9d5ff;

}




input,
textarea,
select{

width:100%;

padding:15px;

margin:10px 0;

background:#333;

border:none;

border-radius:15px;

color:white;

}



textarea{

height:100px;

}





button{

background:#a855f7;

color:white;

border:none;

padding:15px 30px;

border-radius:30px;

cursor:pointer;

font-weight:bold;

}



button:hover{

transform:translateY(-3px);

}





.stats{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:15px;

margin-top:20px;

}



.stat{

background:#333;

padding:20px;

border-radius:15px;

text-align:center;

}



.stat h2{

color:#c084fc;

}





footer{

background:#111;

padding:30px;

text-align:center;

}



@media(max-width:800px){

.container{

grid-template-columns:1fr;

}

}



</style>

</head>




<body>




<header>


<div class="logo">

UniConnect <span>Zambia</span>

</div>



<nav>

<a href="index.html">Home</a>

<a href="message.html">Chat</a>

<a href="boarding.html">Boarding</a>

<a href="marketplace.html">Marketplace</a>

</nav>


</header>








<div class="container">





<div class="card profile">


<img id="profileImage"

src="https://via.placeholder.com/150">



<input type="file"

id="image"

accept="image/*">



<h2 id="displayName">

Student Name

</h2>



<p id="displayUniversity">

University

</p>




<div class="stats">


<div class="stat">

<h2>

0

</h2>

<p>Posts</p>

</div>



<div class="stat">

<h2>

0

</h2>

<p>Listings</p>

</div>



<div class="stat">

<h2>

0

</h2>

<p>Friends</p>

</div>


</div>



</div>









<div class="card">


<h2>

Edit Profile

</h2>



<input id="name"

placeholder="Full Name">



<input id="university"

placeholder="University">



<input id="course"

placeholder="Course (e.g ICT)">



<input id="location"

placeholder="Location">



<input id="phone"

placeholder="Phone Number">





<textarea id="bio"

placeholder="About yourself">

</textarea>





<input id="skills"

placeholder="Skills / Interests">





<button onclick="saveProfile()">

Save Profile

</button>



</div>





</div>







<footer>

<h2>

UniConnect Zambia

</h2>

<p>
Connecting University Students Across Zambia
</p>

</footer>









<script>


let profile =

JSON.parse(localStorage.getItem("profile"))

||

{};





document
.getElementById("image")
.addEventListener("change",function(e){


let reader=new FileReader();


reader.onload=function(){


document
.getElementById("profileImage")
.src=reader.result;



profile.image=reader.result;



localStorage.setItem(

"profile",

JSON.stringify(profile)

);



}


reader.readAsDataURL(e.target.files[0]);


});









function saveProfile(){


profile={


name:
document.getElementById("name").value,


university:
document.getElementById("university").value,


course:
document.getElementById("course").value,


location:
document.getElementById("location").value,


phone:
document.getElementById("phone").value,


bio:
document.getElementById("bio").value,


skills:
document.getElementById("skills").value,


image:
profile.image || ""

};



localStorage.setItem(

"profile",

JSON.stringify(profile)

);



loadProfile();


alert(

"Profile updated successfully"

);


}







function loadProfile(){


if(profile.name){


document.getElementById("displayName")
.innerHTML=profile.name;


document.getElementById("displayUniversity")
.innerHTML=

profile.university;



document.getElementById("name").value=

profile.name;


document.getElementById("university").value=

profile.university;


document.getElementById("course").value=

profile.course;


document.getElementById("location").value=

profile.location;


document.getElementById("phone").value=

profile.phone;


document.getElementById("bio").value=

profile.bio;


document.getElementById("skills").value=

profile.skills;


}



if(profile.image){

document.getElementById("profileImage")
.src=profile.image;

}



}



loadProfile();



</script>


</body>

</html>
