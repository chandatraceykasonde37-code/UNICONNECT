<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UNI CONNECT AI Assistant</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:linear-gradient(135deg,#141e30,#243b55);

color:white;

}



/* NAV */

nav{

background:rgba(0,0,0,.4);

padding:20px 40px;

display:flex;

justify-content:space-between;

align-items:center;

}


.logo{

font-size:28px;

font-weight:bold;

color:#ff914d;

}


nav a{

color:white;

text-decoration:none;

}





/* AI HEADER */


header{

text-align:center;

padding:40px;

}


header h1{

font-size:40px;

}





/* CHAT AREA */


.chat-box{

width:80%;

height:500px;

margin:auto;

background:white;

color:black;

border-radius:20px;

display:flex;

flex-direction:column;

overflow:hidden;

}




.messages{

flex:1;

padding:20px;

overflow-y:auto;

background:#f4f4f4;

}



.message{

padding:12px;

border-radius:15px;

margin:10px;

max-width:70%;

}



.ai{

background:#243b55;

color:white;

}



.user{

background:#ff914d;

color:white;

margin-left:auto;

}





.input-area{

display:flex;

padding:15px;

}



.input-area input{

flex:1;

padding:15px;

border-radius:30px;

border:1px solid #ccc;

}



.input-area button{

margin-left:10px;

padding:15px 25px;

border:none;

border-radius:30px;

background:#ff914d;

color:white;

cursor:pointer;

}





/* QUICK QUESTIONS */


.quick{

text-align:center;

padding:30px;

}



.quick button{

margin:8px;

padding:12px 20px;

border:none;

border-radius:20px;

background:white;

color:#243b55;

cursor:pointer;

}




footer{

text-align:center;

padding:30px;

background:rgba(0,0,0,.4);

}





@media(max-width:700px){

.chat-box{

width:95%;

}

}

</style>


</head>


<body>



<nav>


<div class="logo">
🤖 UNI CONNECT AI
</div>


<a href="dashboard.html">
Dashboard
</a>


</nav>








<header>


<h1>
🤖 UNI CONNECT AI Study Assistant
</h1>


<p>
Your learning companion for university.
</p>


</header>









<div class="quick">


<h2>
Quick Questions
</h2>


<button onclick="ask('Explain C++')">
C++ Help
</button>


<button onclick="ask('Explain HTML')">
HTML Help
</button>


<button onclick="ask('Explain Mathematics')">
Math Help
</button>


<button onclick="ask('Study tips')">
Study Tips
</button>



</div>









<div class="chat-box">



<div class="messages" id="messages">


<div class="message ai">

Hello 👋 I am UNI CONNECT AI. Ask me about programming, mathematics, or university topics.

</div>



</div>






<div class="input-area">


<input 
type="text"
id="input"
placeholder="Ask a question..."
>



<button onclick="sendMessage()">

Send

</button>


</div>



</div>









<script>


function sendMessage(){


let input =
document.getElementById("input");


let question =
input.value;



if(question==="") return;




addMessage(question,"user");



input.value="";



setTimeout(()=>{


let answer =
generateAnswer(question);



addMessage(answer,"ai");



},500);



}








function ask(question){


document.getElementById("input").value=question;


sendMessage();


}









function addMessage(text,type){


let messages =
document.getElementById("messages");



let div =
document.createElement("div");



div.className=
"message "+type;



div.innerHTML=text;



messages.appendChild(div);



messages.scrollTop=
messages.scrollHeight;


}









function generateAnswer(question){


question=
question.toLowerCase();




if(question.includes("c++")){


return "C++ is a programming language used to create software, games, operating systems, and applications. It uses concepts like variables, classes, functions, and objects.";

}





if(question.includes("html")){


return "HTML means HyperText Markup Language. It is used to create the structure of websites using elements like headings, paragraphs, images, and links.";

}





if(question.includes("math")){


return "Mathematics helps ICT students understand algorithms, logic, statistics, and problem solving.";

}





if(question.includes("study")){


return "Study tips: create a timetable, practice regularly, review notes, solve past papers, and ask questions when you do not understand.";

}





if(question.includes("javascript")){


return "JavaScript adds interaction to websites. It can control buttons, forms, animations, and dynamic content.";

}





return "I am still learning 🤖. Try asking about programming, mathematics, ICT courses, or study skills.";

}





</script>







<footer>


<h2>
🎓 UNI CONNECT Zambia
</h2>


<p>
Learning made easier.
</p>


</footer>



</body>

</html>
