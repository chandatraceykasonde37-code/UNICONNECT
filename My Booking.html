<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniConnect Zambia | Booking</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}


body{

background:#2b2b2b;

color:white;

}




header{

background:#171717;

padding:20px 8%;

display:flex;

justify-content:space-between;

align-items:center;

}



.logo{

font-size:30px;

font-weight:bold;

}



.logo span{

color:#c084fc;

}





nav a{

color:white;

text-decoration:none;

margin:10px;

}



nav a:hover{

color:#c084fc;

}





.hero{

padding:60px;

text-align:center;

background:

linear-gradient(

rgba(0,0,0,.7),

rgba(0,0,0,.8)

);

}



.hero h1{

font-size:50px;

color:#d8b4fe;

}





.container{

padding:50px 8%;

}





.card{

background:

rgba(255,255,255,.08);

border:1px solid #555;

padding:30px;

border-radius:25px;

backdrop-filter:blur(15px);

}



input,
select,
textarea{


width:100%;

padding:15px;

margin:10px 0;

background:#333;

border:none;

border-radius:15px;

color:white;


}




button{


background:#a855f7;

border:none;

color:white;

padding:15px 35px;

border-radius:30px;

cursor:pointer;

font-weight:bold;


}



button:hover{

transform:translateY(-3px);

}





.booking-card{


background:#333;

padding:20px;

border-radius:15px;

margin:15px 0;


}




.status{

color:#c084fc;

font-weight:bold;

}





footer{

background:#111;

padding:30px;

text-align:center;

}



</style>

</head>



<body>




<header>


<div class="logo">

UniConnect <span>Zambia</span>

</div>



<nav>

<a href="index.html">
Home
</a>

<a href="boarding.html">
Boarding
</a>

<a href="message.html">
Chat
</a>

</nav>


</header>








<section class="hero">


<h1>

Book Boarding Viewing

</h1>


<p>

Schedule a visit before choosing your accommodation.

</p>


</section>









<div class="container">


<div class="card">


<h2>

Request Viewing

</h2>




<select id="house">


<option>
Level Up Lifestyle Hub
</option>


<option>
Campus View Hostel
</option>


<option>
UNZA Student Residence
</option>


</select>





<input id="name"

placeholder="Your Full Name">





<input id="phone"

placeholder="Phone Number">





<input id="email"

placeholder="Email Address">






<input type="date"

id="date">






<textarea id="message"

placeholder="Additional message">

</textarea>







<button onclick="book()">

Send Booking Request

</button>




</div>







<br><br>






<div class="card">


<h2>

My Booking Requests

</h2>



<div id="requests">

</div>


</div>



</div>









<footer>


<h2>

UniConnect Zambia

</h2>


<p>

Connecting Students Across Zambia

</p>


</footer>









<script>


let bookings =

JSON.parse(localStorage.getItem("bookings"))

||

[];







function book(){



let request={


house:

document.getElementById("house").value,


name:

document.getElementById("name").value,


phone:

document.getElementById("phone").value,


email:

document.getElementById("email").value,


date:

document.getElementById("date").value,


message:

document.getElementById("message").value,


status:"Pending Approval"


};




bookings.push(request);



localStorage.setItem(

"bookings",

JSON.stringify(bookings)

);



display();



alert(

"Booking request sent successfully"

);



}







function display(){



let box=

document.getElementById("requests");



box.innerHTML="";



bookings.forEach((b)=>{


box.innerHTML+=`


<div class="booking-card">


<h3>

${b.house}

</h3>



<p>

Date: ${b.date}

</p>


<p>

Student: ${b.name}

</p>



<p class="status">

${b.status}

</p>



</div>


`;



});



}



display();



</script>



</body>

</html>
