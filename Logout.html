<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniConnect Zambia | Logout</title>


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;

}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:

radial-gradient(circle,#555,#2b2b2b 60%,#1c1c1c);

color:white;

}




.logout-box{

width:400px;

padding:40px;

text-align:center;

background:

rgba(255,255,255,.08);

border:1px solid #555;

border-radius:25px;

backdrop-filter:blur(15px);

}




.logo{

font-size:35px;

font-weight:bold;

margin-bottom:20px;

}



.logo span{

color:#c084fc;

}




h1{

color:#e9d5ff;

margin-bottom:20px;

}



p{

color:#ccc;

margin-bottom:30px;

}





button{

padding:15px 35px;

border:none;

border-radius:30px;

background:#a855f7;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

margin:5px;

}




button:hover{

transform:scale(1.05);

}




.cancel{

background:#444;

}





</style>

</head>



<body>





<div class="logout-box">


<div class="logo">

UniConnect <span>Zambia</span>

</div>



<h1>

Logout

</h1>


<p>

Are you sure you want to logout?

</p>



<button onclick="logout()">

Yes, Logout

</button>



<button class="cancel" onclick="goBack()">

Cancel

</button>



</div>








<script>


function logout(){


/*

Remove saved login information

*/

localStorage.removeItem("profile");

localStorage.removeItem("user");

localStorage.removeItem("session");



alert(

"You have been logged out successfully."

);



window.location.href=

"UniConnectZambia.html";


}







function goBack(){


window.history.back();


}



</script>




</body>

</html>
