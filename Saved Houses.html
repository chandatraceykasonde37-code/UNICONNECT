<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniConnect Zambia | Saved Houses</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}


body{

background:#2b2b2b;

color:white;

}




header{

background:#171717;

padding:20px 8%;

display:flex;

justify-content:space-between;

align-items:center;

}



.logo{

font-size:30px;

font-weight:bold;

}


.logo span{

color:#c084fc;

}





nav a{

color:white;

text-decoration:none;

margin:10px;

}



nav a:hover{

color:#c084fc;

}





.hero{

text-align:center;

padding:50px;

}



.hero h1{

font-size:45px;

color:#e9d5ff;

}





.search{

padding:20px 8%;

}



.search input{

width:100%;

padding:15px;

border:none;

border-radius:30px;

background:#333;

color:white;

}





.houses{


padding:40px 8%;


display:grid;

grid-template-columns:

repeat(3,1fr);


gap:25px;


}





.house-card{


background:

rgba(255,255,255,.08);


border:1px solid #555;


border-radius:25px;


padding:25px;


backdrop-filter:blur(15px);


}





.house-card img{


width:100%;

height:200px;

object-fit:cover;

border-radius:20px;


}





.house-card h2{


color:#d8b4fe;


margin-top:15px;


}





.price{

color:#c084fc;

font-size:22px;

}





button{


padding:12px 25px;

margin:5px;

border:none;

border-radius:30px;

background:#a855f7;

color:white;

cursor:pointer;

}



.remove{

background:#d33;

}




.empty{


text-align:center;

font-size:22px;

color:#aaa;

}





footer{

background:#111;

padding:30px;

text-align:center;

}





@media(max-width:900px){


.houses{

grid-template-columns:1fr;

}


}



</style>

</head>




<body>




<header>


<div class="logo">

UniConnect <span>Zambia</span>

</div>



<nav>

<a href="index.html">Home</a>

<a href="boarding.html">Boarding</a>

<a href="message.html">Chat</a>

<a href="profile.html">Profile</a>

</nav>


</header>







<section class="hero">

<h1>

❤️ Saved Boarding Houses

</h1>


<p>

Your favourite student accommodations in one place.

</p>


</section>







<div class="search">

<input id="search"

placeholder="Search saved houses...">

</div>









<section class="houses" id="houseList">


</section>







<footer>


<h2>

UniConnect Zambia

</h2>


<p>

Connecting Students Across Zambia

</p>


</footer>







<script>


let savedHouses = JSON.parse(

localStorage.getItem("savedHouses")

)

||

[


{

name:"Level Up Lifestyle Hub",

location:"Meanwood, Lusaka",

price:"1500",

image:"images/house1.jpg"

},


{

name:"Campus View Hostel",

location:"Near University",

price:"1200",

image:"images/house2.jpg"

}


];







function displayHouses(){


let box=document.getElementById("houseList");


box.innerHTML="";



if(savedHouses.length===0){


box.innerHTML=

`

<div class="empty">

No saved houses yet.

</div>

`;

return;

}




savedHouses.forEach((house,index)=>{


box.innerHTML+=`


<div class="house-card">


<img src="${house.image}">


<h2>

${house.name}

</h2>


<p>

📍 ${house.location}

</p>



<p class="price">

K${house.price}/Month

</p>



<button onclick="viewDetails('${house.name}')">

View Details

</button>



<button onclick="bookHouse('${house.name}')">

Book Viewing

</button>



<button class="remove"

onclick="removeHouse(${index})">

Remove

</button>


</div>


`;



});



}









function removeHouse(index){


savedHouses.splice(index,1);


localStorage.setItem(

"savedHouses",

JSON.stringify(savedHouses)

);



displayHouses();


}







function viewDetails(name){


window.location.href=

"view details.html?house="+name;


}







function bookHouse(name){


window.location.href=

"booking.html?house="+name;


}







document
.getElementById("search")
.addEventListener("keyup",function(){


let value=this.value.toLowerCase();


document.querySelectorAll(".house-card")

.forEach(card=>{


card.style.display=

card.innerText.toLowerCase()

.includes(value)

?

"block"

:

"none";


});


});






displayHouses();



</script>




</body>

</html>
