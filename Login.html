<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniConnect Zambia | Login</title>


<style>

/* =========================
   GENERAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}


body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at 20% 20%,
        #4b3b5a,
        transparent 35%
    ),

    radial-gradient(
        circle at 80% 80%,
        #33243d,
        transparent 35%
    ),

    #242424;

    color:white;

    display:flex;

    flex-direction:column;

}


/* =========================
   HEADER
========================= */

header{

    background:#171717;

    padding:20px 8%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    border-bottom:1px solid #444;

}


.logo{

    font-size:28px;

    font-weight:bold;

}


.logo span{

    color:#c084fc;

}


header p{

    color:#aaa;

    font-size:14px;

}


/* =========================
   MAIN
========================= */

main{

    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:40px 20px;

}


/* =========================
   LOGIN BOX
========================= */

.login-container{

    width:100%;

    max-width:430px;

    background:
    rgba(255,255,255,.08);

    border:1px solid #555;

    border-radius:25px;

    padding:40px;

    backdrop-filter:blur(18px);

    box-shadow:
    0 20px 50px
    rgba(0,0,0,.4);

}


/* =========================
   LOGIN TITLE
========================= */

.login-header{

    text-align:center;

    margin-bottom:30px;

}


.login-icon{

    width:70px;

    height:70px;

    margin:0 auto 18px;

    background:#a855f7;

    border-radius:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:32px;

    box-shadow:
    0 8px 25px
    rgba(168,85,247,.3);

}


.login-header h1{

    color:#e9d5ff;

    font-size:30px;

    margin-bottom:8px;

}


.login-header p{

    color:#aaa;

    font-size:14px;

}


/* =========================
   FORM
========================= */

.form-group{

    margin-bottom:18px;

}


.form-group label{

    display:block;

    margin-bottom:7px;

    color:#ddd;

    font-size:14px;

    font-weight:600;

}


.form-group input{

    width:100%;

    padding:15px;

    background:#333;

    color:white;

    border:1px solid #555;

    border-radius:12px;

    outline:none;

    font-size:15px;

    transition:.3s;

}


.form-group input:focus{

    border-color:#a855f7;

    box-shadow:
    0 0 0 3px
    rgba(168,85,247,.1);

}


.form-group input::placeholder{

    color:#888;

}


/* =========================
   PASSWORD
========================= */

.password-box{

    position:relative;

}


.password-box input{

    padding-right:60px;

}


.show-password{

    position:absolute;

    right:15px;

    top:50%;

    transform:translateY(-50%);

    background:none;

    border:none;

    color:#c084fc;

    cursor:pointer;

    font-size:18px;

}


/* =========================
   OPTIONS
========================= */

.login-options{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin:10px 0 22px;

    font-size:13px;

}


.remember{

    display:flex;

    align-items:center;

    gap:7px;

    color:#aaa;

}


.remember input{

    accent-color:#a855f7;

}


.forgot{

    color:#c084fc;

    text-decoration:none;

}


.forgot:hover{

    color:#e9d5ff;

}


/* =========================
   LOGIN BUTTON
========================= */

.login-button{

    width:100%;

    padding:15px;

    background:#a855f7;

    color:white;

    border:none;

    border-radius:30px;

    cursor:pointer;

    font-size:16px;

    font-weight:bold;

    transition:.3s;

}


.login-button:hover{

    background:#9333ea;

    transform:translateY(-2px);

    box-shadow:
    0 8px 20px
    rgba(168,85,247,.25);

}


/* =========================
   DIVIDER
========================= */

.divider{

    display:flex;

    align-items:center;

    gap:15px;

    margin:25px 0;

    color:#777;

    font-size:13px;

}


.divider::before,
.divider::after{

    content:"";

    flex:1;

    height:1px;

    background:#555;

}


/* =========================
   REGISTER
========================= */

.register{

    text-align:center;

    color:#aaa;

    font-size:14px;

}


.register a{

    color:#c084fc;

    text-decoration:none;

    font-weight:bold;

}


.register a:hover{

    color:#e9d5ff;

}


/* =========================
   FOOTER
========================= */

footer{

    background:#111;

    padding:20px;

    text-align:center;

    border-top:1px solid #333;

}


footer p{

    color:#777;

    font-size:13px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{

        justify-content:center;

    }

    header p{

        display:none;

    }

    .login-container{

        padding:30px 25px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<div class="logo">

UniConnect <span>Zambia</span>

</div>


<p>

Student Connection Platform

</p>

</header>



<!-- =========================
     MAIN
========================= -->

<main>


<div class="login-container">


<!-- LOGIN HEADER -->

<div class="login-header">


<div class="login-icon">

🎓

</div>


<h1>

Welcome Back

</h1>


<p>

Login to your UniConnect Zambia account

</p>


</div>



<!-- LOGIN FORM -->

<form id="loginForm">


<!-- EMAIL -->

<div class="form-group">

<label>

Email Address

</label>


<input
type="email"
id="email"
placeholder="Enter your university email"
required
>

</div>



<!-- PASSWORD -->

<div class="form-group">

<label>

Password

</label>


<div class="password-box">


<input
type="password"
id="password"
placeholder="Enter your password"
required
>


<button
type="button"
class="show-password"
onclick="togglePassword()"
>

👁

</button>


</div>

</div>



<!-- OPTIONS -->

<div class="login-options">


<label class="remember">

<input
type="checkbox"
id="remember"
>

Remember me

</label>


<a href="#"
class="forgot"
onclick="forgotPassword()">

Forgot password?

</a>


</div>



<!-- LOGIN -->

<button
type="submit"
class="login-button"
>

Login

</button>


</form>



<!-- DIVIDER -->

<div class="divider">

OR

</div>



<!-- REGISTER -->

<div class="register">

Don't have an account?

<a href="Signup.html">

Create Account

</a>

</div>


</div>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer>

<p>

© 2026 UniConnect Zambia —
Connecting Students Across Zambia

</p>

</footer>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   SHOW PASSWORD
========================= */

function togglePassword(){

    const password =
    document.getElementById("password");

    const button =
    document.querySelector(".show-password");


    if(password.type === "password"){

        password.type = "text";

        button.innerHTML = "🙈";

    }

    else{

        password.type = "password";

        button.innerHTML = "👁";

    }

}



/* =========================
   LOGIN
========================= */

document
.getElementById("loginForm")
.addEventListener("submit", function(event){

    event.preventDefault();


    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;


    if(email === "" || password === ""){

        alert(
        "Please enter your email and password."
        );

        return;

    }


    /*
       Temporary login.

       Later this will connect
       to your backend/MySQL.
    */


    alert(
    "Login successful!\n\nWelcome to UniConnect Zambia."
    );


    window.location.href =
    "Home.html";

});



/* =========================
   FORGOT PASSWORD
========================= */

function forgotPassword(){

    alert(
    "Password recovery will be available soon."
    );

}

</script>


</body>

</html>
