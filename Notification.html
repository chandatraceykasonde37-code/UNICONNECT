<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniConnect Zambia | Notifications</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}


body{

background:#2b2b2b;

color:white;

}



header{

background:#171717;

padding:20px 8%;

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:1px solid #444;

}



.logo{

font-size:30px;

font-weight:bold;

}


.logo span{

color:#c084fc;

text-shadow:0 0 15px #a855f7;

}



nav a{

color:white;

text-decoration:none;

margin:10px;

}



nav a:hover{

color:#c084fc;

}





.hero{

text-align:center;

padding:50px;

}



.hero h1{

font-size:45px;

color:#e9d5ff;

}





.container{

padding:40px 8%;

}




.card{

background:

rgba(255,255,255,.08);

border:1px solid #555;

border-radius:25px;

padding:30px;

backdrop-filter:blur(15px);

}





.notification{

background:#333;

padding:20px;

border-radius:18px;

margin:15px 0;

border-left:5px solid #a855f7;

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

}



.notification.unread{

background:#444;

}



.notification h3{

color:#e9d5ff;

}



.time{

color:#aaa;

font-size:14px;

}



button{

padding:12px 25px;

border:none;

border-radius:30px;

background:#a855f7;

color:white;

cursor:pointer;

margin:5px;

}



.delete{

background:#c62828;

}



.clear{

background:#555;

}





.empty{

text-align:center;

color:#aaa;

font-size:20px;

padding:30px;

}



footer{

background:#111;

padding:30px;

text-align:center;

}




</style>

</head>



<body>




<header>


<div class="logo">

UniConnect <span>Zambia</span>

</div>



<nav>

<a href="dashboard.html">Dashboard</a>

<a href="message.html">Chat</a>

<a href="profile.html">Profile</a>

<a href="settings.html">Settings</a>

</nav>


</header>







<section class="hero">

<h1>

🔔 Notifications

</h1>

<p>

Stay updated with everything happening on UniConnect Zambia.

</p>

</section>







<div class="container">


<div class="card">


<button class="clear" onclick="clearAll()">

Clear All

</button>


<div id="notificationList">

</div>



</div>


</div>







<footer>

<h2>
UniConnect Zambia
</h2>

<p>
Connecting University Students Across Zambia
</p>

</footer>







<script>


let notifications =

JSON.parse(

localStorage.getItem("notifications")

)

||

[


{

title:"Welcome to UniConnect Zambia",

message:"Your account has been created successfully.",

time:"Now",

read:false

},


{

title:"New Boarding House Added",

message:"A new student accommodation is available near Lusaka.",

time:"Today",

read:false

},


{

title:"Internship Opportunity",

message:"A new ICT internship opportunity has been posted.",

time:"Yesterday",

read:false

}

];









function displayNotifications(){


let box=

document.getElementById("notificationList");


box.innerHTML="";



if(notifications.length===0){


box.innerHTML=

`

<div class="empty">

No notifications available.

</div>

`;

return;

}





notifications.forEach((n,index)=>{


box.innerHTML+=`


<div class="notification ${n.read?'':'unread'}">


<div>


<h3>

${n.title}

</h3>


<p>

${n.message}

</p>


<span class="time">

${n.time}

</span>


</div>



<div>


<button onclick="readNotification(${index})">

${n.read?"Read":"Mark Read"}

</button>



<button class="delete"

onclick="deleteNotification(${index})">

Delete

</button>


</div>



</div>


`;



});



save();



}







function readNotification(index){


notifications[index].read=true;


displayNotifications();


}







function deleteNotification(index){


notifications.splice(index,1);


displayNotifications();


}







function clearAll(){


if(confirm("Delete all notifications?")){


notifications=[];


displayNotifications();


}


}







function save(){


localStorage.setItem(

"notifications",

JSON.stringify(notifications)

);


}





displayNotifications();



</script>



</body>

</html>
