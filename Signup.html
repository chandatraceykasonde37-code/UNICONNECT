<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniConnect Zambia | Sign Up</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}


body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:

radial-gradient(circle,#555,#2b2b2b 60%,#171717);

color:white;

}



.signup-box{

width:450px;

padding:35px;

background:

rgba(255,255,255,.08);

border:1px solid #555;

border-radius:25px;

backdrop-filter:blur(15px);

}



.logo{

text-align:center;

font-size:35px;

font-weight:bold;

margin-bottom:20px;

}



.logo span{

color:#c084fc;

}



h1{

text-align:center;

color:#e9d5ff;

margin-bottom:20px;

}



input,
select{

width:100%;

padding:14px;

margin:10px 0;

background:#333;

border:none;

border-radius:15px;

color:white;

}



button{

width:100%;

padding:15px;

margin-top:20px;

border:none;

border-radius:30px;

background:#a855f7;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}



button:hover{

background:#9333ea;

}



.profile-preview{

text-align:center;

}



.profile-preview img{

width:120px;

height:120px;

border-radius:50%;

border:4px solid #a855f7;

object-fit:cover;

}



a{

color:#c084fc;

text-decoration:none;

}



.login{

text-align:center;

margin-top:20px;

}



</style>

</head>



<body>



<div class="signup-box">


<div class="logo">

UniConnect <span>Zambia</span>

</div>



<h1>

Create Student Account

</h1>




<div class="profile-preview">


<img id="preview"

src="https://via.placeholder.com/120">


</div>



<input type="file" id="image" accept="image/*">





<input id="name"

placeholder="Full Name">



<input id="email"

type="email"

placeholder="Email Address">



<input id="phone"

placeholder="Phone Number">






<select id="university">


<option value="">

Select University

</option>


<option>
Eden University
</option>


<option>
University of Zambia (UNZA)
</option>


<option>
Copperbelt University (CBU)
</option>


<option>
Mulungushi University
</option>


<option>
Northrise University
</option>


</select>







<select id="course">


<option>
Select Course

</option>


<option>
ICT

</option>


<option>
Computer Science

</option>


<option>
Business

</option>


<option>
Engineering

</option>


<option>
Education

</option>


</select>







<input id="password"

type="password"

placeholder="Password">



<input id="confirm"

type="password"

placeholder="Confirm Password">





<button onclick="signup()">

Create Account

</button>





<div class="login">

Already have an account?

<a href="login.html">

Login

</a>


</div>



</div>









<script>


let image="";



document

.getElementById("image")

.addEventListener("change",function(e){



let reader=new FileReader();



reader.onload=function(){


image=reader.result;


document

.getElementById("preview")

.src=image;


}



reader.readAsDataURL(e.target.files[0]);

});








function signup(){



let password=

document.getElementById("password").value;



let confirm=

document.getElementById("confirm").value;





if(password!==confirm){


alert("Passwords do not match.");

return;


}






let user={



name:

document.getElementById("name").value,


email:

document.getElementById("email").value,


phone:

document.getElementById("phone").value,


university:

document.getElementById("university").value,


course:

document.getElementById("course").value,


password:password,


image:image



};





localStorage.setItem(

"profile",

JSON.stringify(user)

);



localStorage.setItem(

"user",

JSON.stringify(user)

);






alert(

"Account created successfully!"

);





window.location.href=

"dashboard.html";



}





</script>



</body>

</html>
