<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniConnect Zambia</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}


body{

height:100vh;

background:

radial-gradient(circle at center,#666,#2b2b2b 55%,#1c1c1c);

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

color:white;

}



/* Floating background lights */

.circle{

position:absolute;

border-radius:50%;

background:#c084fc;

opacity:.25;

filter:blur(10px);

animation:move 8s infinite alternate;

}


.circle.one{

width:300px;

height:300px;

top:-100px;

left:-100px;

}


.circle.two{

width:250px;

height:250px;

bottom:-80px;

right:-80px;

animation-delay:2s;

}



@keyframes move{

from{

transform:translateY(0);

}

to{

transform:translateY(50px);

}

}





.container{

text-align:center;

z-index:2;

}




.logo{

font-size:70px;

font-weight:900;

letter-spacing:3px;

animation:glow 2s infinite alternate;

}



.logo span{

color:#d8b4fe;

}




@keyframes glow{

from{

text-shadow:0 0 10px #c084fc;

}


to{

text-shadow:

0 0 50px #a855f7;

}

}





.tagline{

font-size:24px;

margin-top:20px;

color:#ddd;

}



button{

margin-top:35px;

padding:15px 45px;

border:none;

border-radius:40px;

background:

linear-gradient(45deg,#9333ea,#d8b4fe);

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

box-shadow:0 0 30px #9333ea;

}




button:hover{

transform:scale(1.1);

}



#countdown{

margin-top:30px;

color:#ccc;

}



</style>

</head>




<body>


<div class="circle one"></div>

<div class="circle two"></div>





<div class="container">


<div class="logo">

UniConnect <span>Zambia</span>

</div>



<div class="tagline">

Connect • Apply • Share • Learn • Explore

</div>




<button onclick="enterNow()">

Enter Platform

</button>



<p id="countdown">

Opening UniConnect Zambia in 10 seconds...

</p>



</div>







<script>


let seconds = 10;


let timer = setInterval(function(){


seconds--;


document.getElementById("countdown").innerHTML =

"Opening UniConnect Zambia in " + seconds + " seconds...";



if(seconds <= 0){


clearInterval(timer);


window.location.href="Home.html";


}


},1000);





function enterNow(){


window.location.href="Home.html";


}



</script>




</body>

</html>
