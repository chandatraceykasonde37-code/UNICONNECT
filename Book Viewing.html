<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniConnect Zambia | Boarding Details</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    background:#222;
    color:white;

}


/* HEADER */

header{

    background:#111;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;

}


.logo{

    font-size:28px;

}


.logo span{

    color:#9b5cff;

}


nav a{

    color:white;
    text-decoration:none;
    margin-left:20px;

}


nav a:hover{

    color:#9b5cff;

}



/* MAIN */

.details{

    width:90%;
    margin:40px auto;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:40px;

}



/* IMAGE */

.main-image img{

    width:100%;

    height:450px;

    object-fit:cover;

    border-radius:25px;

    box-shadow:0 0 30px #9b5cff;

}




.gallery{

    display:flex;

    gap:10px;

    margin-top:15px;

}


.gallery img{

    width:80px;

    height:80px;

    object-fit:cover;

    border-radius:10px;

    cursor:pointer;

}



/* DETAILS CARD */


.card{

    background:#333;

    padding:35px;

    border-radius:25px;

    box-shadow:0 0 25px rgba(155,92,255,.4);

}


.card h1{

    color:#c084fc;

    font-size:40px;

}



.info{

    margin:20px 0;

}



.info p{

    margin:15px 0;

}



ul{

    margin:20px;

}


button{

    background:#9b5cff;

    color:white;

    border:none;

    padding:15px 35px;

    border-radius:30px;

    font-size:17px;

    cursor:pointer;

}



button:hover{

    background:#7c3aed;

    transform:scale(1.05);

}





footer{

    background:#111;

    text-align:center;

    padding:30px;

    margin-top:40px;

}





@media(max-width:900px){


.details{

grid-template-columns:1fr;

}


}



</style>


</head>



<body>



<header>


<div class="logo">

UniConnect <span>Zambia</span>

</div>


<nav>

<a href="Home.html">Home</a>

<a href="Boarding.html">Boarding</a>

<a href="Profile.html">Profile</a>

</nav>


</header>





<section class="details">



<div class="photos">


<div class="main-image">

<img id="mainImage">

</div>


<div class="gallery" id="gallery"></div>


</div>






<div class="card">


<h1 id="houseName">
</h1>



<div class="info">


<p id="location"></p>

<p id="price"></p>

<p id="rooms"></p>


</div>




<h2>
Facilities
</h2>


<ul id="facilityList"></ul>




<button onclick="bookViewing()">

Book Viewing

</button>



</div>


</section>







<footer>

<h3>
UniConnect Zambia
</h3>

<p>
Connecting University Students Across Zambia
</p>

</footer>







<script>


/*
ADD NEW BOARDING HOUSES HERE
Only add another object.
The page updates automatically.
*/


const boardingHouses=[


{

id:1,

name:"Level Up Lifestyle Hub",

location:"Meanwood, Lusaka",

price:"K1,500 / Month",

rooms:"10 Bed Spaces Available",

images:[

"images/house1.jpg",

"images/room1.jpg",

"images/livingroom.jpg"

],

facilities:[

"WiFi",

"24/7 Security",

"Water Included",

"Electricity",

"Study Area"

]

},




{

id:2,

name:"Campus View Apartments",

location:"Chelstone, Lusaka",

price:"K1,200 / Month",

rooms:"6 Bed Spaces Available",

images:[

"images/house2.jpg",

"images/room2.jpg"

],

facilities:[

"WiFi",

"Parking",

"Security",

"Kitchen"

]

},





{

id:3,

name:"Student Haven Rooms",

location:"Kabulonga, Lusaka",

price:"K1,800 / Month",

rooms:"4 Bed Spaces Available",

images:[

"images/house3.jpg"

],

facilities:[

"Electricity",

"Water",

"Internet",

"Security"

]

}



];





// GET HOUSE ID FROM LINK


const urlParams=new URLSearchParams(window.location.search);


const id=urlParams.get("id");



const house=boardingHouses.find(
item=>item.id==id
);






if(house){


document.getElementById("mainImage").src=
house.images[0];


document.getElementById("houseName").innerHTML=
house.name;


document.getElementById("location").innerHTML=
"📍 "+house.location;


document.getElementById("price").innerHTML=
"💰 "+house.price;


document.getElementById("rooms").innerHTML=
"🛏 "+house.rooms;




let gallery=document.getElementById("gallery");


house.images.forEach(image=>{


let img=document.createElement("img");


img.src=image;


img.onclick=function(){

document.getElementById("mainImage").src=image;

};


gallery.appendChild(img);


});





let list=document.getElementById("facilityList");


house.facilities.forEach(item=>{


let li=document.createElement("li");

li.innerHTML=item;


list.appendChild(li);


});



}

else{


document.getElementById("houseName").innerHTML=
"Boarding House Not Found";


}






function bookViewing(){


window.location.href=
"book-viewing.html?id="+id;


}



</script>



</body>

</html>
